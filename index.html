<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

    width: 100%; max-width: 380px; background: #151514;
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    padding: 32px 28px; display: flex; flex-direction: column; gap: 18px;
  }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .brand span { color: #4ade80; }
  .hint {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #85847d;
  }
  input {
    width: 100%; background: #1c1c1b; color: #f5f5f2;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
    padding: 12px 14px; font-size: 15px; outline: none;
  }
  input:focus { border-color: rgba(74,222,128,0.5); }
  button {
    width: 100%; background: #4ade80; color: #0d0d0d; border: 0;
    border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 650; cursor: pointer;
  }
  button:hover { background: #6ee79b; }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: #f87171; font-size: 13px; min-height: 18px; }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'abrindo…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64(SALT), iterations: ITER, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(IV) }, key, b64(DATA));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = 'senha incorreta';
    btn.disabled = false; btn.textContent = 'entrar';
    document.getElementById('pw').select();
  }
});
</script>
